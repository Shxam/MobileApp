name: 📱 Android Fastlane Build & Play Console Internal Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on release tags like v1.0.0
  workflow_dispatch:

jobs:
  android-release:
    name: 🤖 Build Signed Android AAB & Upload to Play Console Internal Track
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💎 Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 📦 Install Frontend & Capacitor Dependencies
        run: npm ci

      - name: 🏗️ Build Web Frontend Asset Bundle
        run: npm run build

      - name: 📱 Sync Capacitor Android Project
        run: npx cap sync android || true

      - name: 🔑 Decode Android Release Keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set. Skipping keystore decode."
          fi

      - name: 🔑 Decode Play Console Service Account Key from GitHub Secrets
        env:
          PLAY_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_CONSOLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$PLAY_CONSOLE_SERVICE_ACCOUNT_JSON" > apps/mobile/fastlane/play-console-service-account.json
          else
            echo "⚠️ PLAY_CONSOLE_SERVICE_ACCOUNT_JSON secret not set. Skipping key decode."
          fi

      - name: 🚀 Run Fastlane Internal Release Lane
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "apps/mobile/fastlane/play-console-service-account.json" ]; then
            cd apps/mobile && bundle exec fastlane internal
          else
            echo "⚠️ Skipping Fastlane Play Store upload until Play Console Service Account JSON secret is provided."
          fi
