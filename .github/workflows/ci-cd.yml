name: 🚀 IPL Dhaba Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Lint, Typecheck & Integration Tests ──────────
  lint-and-test:
    name: 🧪 Lint, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipldhaba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Typecheck & Lint
        run: npm run lint

      - name: 🧪 Run Integration Tests against Service Containers
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipldhaba_test?sslmode=disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-2026
          JWT_REFRESH_SECRET: test-refresh-secret-key-2026
        run: npx jest apps/backend/src/modules/auth/auth.integration.spec.ts --runInBand

  # ── 2. Build & Push Docker Image to GHCR ──────────
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image (GHCR)
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🔨 Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 3. Deploy to Fly.io / Render ───────────────────
  deploy:
    name: 🚀 Deploy to Cloud Environment
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Trigger Fly.io / Render Deploy Hook
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Checking deployment target configuration..."
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "Deploying to Fly.io using FLY_API_TOKEN..."
            # npx flyctl deploy --remote-only
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "⚠️ No deployment credentials set in GitHub Secrets. Skipping automatic deploy step until confirmed."
          fi
