name: 🚀 IPL Dhaba Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Lint, Typecheck & Integration Tests ──────────
  lint-and-test:
    name: 🧪 Lint, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipldhaba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Typecheck Frontend
        run: npm run lint

      # The frontend and backend compile under different configs (ESM + JSX vs
      # CommonJS + decorators). Running only the first left every backend type
      # error to be discovered in production.
      - name: 🔍 Typecheck Backend
        run: npm run lint:backend

      - name: 🏗️ Build Frontend
        run: npm run build

      # Compiles to ./dist exactly as the Dockerfile does, so a build break is
      # caught here rather than at image-build time.
      - name: 🏗️ Build Backend
        run: npm run build:backend

      # The whole suite. This step used to name a single spec file, so the
      # authorization, core-domain, dispatch and realtime integration tests
      # never ran in CI at all.
      - name: 🧪 Run Full Integration Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipldhaba_test?sslmode=disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-2026
          JWT_REFRESH_SECRET: test-refresh-secret-key-2026
          GATE_PASS_SECRET: test-gate-pass-secret-key-2026
        run: npm test

  # ── 2. Build & Push Docker Image to GHCR ──────────
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image (GHCR)
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🔨 Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 3. Deploy to Fly.io / Render ───────────────────
  deploy:
    name: 🚀 Deploy to Cloud Environment
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      # Migrations run BEFORE the new image goes live. The Phase 2 migration adds
      # columns the new code selects unconditionally, so deploying the image
      # against an unmigrated database fails every query. Additive, idempotent
      # migrations make this safe to run while the old revision is still serving.
      - name: 🗄️ Apply Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — refusing to deploy an image whose migrations have not been applied."
            exit 1
          fi
          npx prisma migrate deploy

      - name: 🚀 Trigger Fly.io / Render Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            if [ ! -f fly.toml ]; then
              echo "::error::FLY_API_TOKEN is set but fly.toml is missing. Run 'flyctl launch --no-deploy' and commit it."
              exit 1
            fi
            echo "Deploying to Fly.io..."
            npx --yes flyctl deploy --remote-only
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy hook..."
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "::error::No deployment target configured. Set either FLY_API_TOKEN or RENDER_DEPLOY_HOOK_URL in repository secrets."
            exit 1
          fi
