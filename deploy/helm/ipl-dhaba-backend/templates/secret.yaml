apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ipl-dhaba-backend.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "ipl-dhaba-backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  GATE_PASS_SECRET: {{ .Values.secrets.gatePassSecret | quote }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.razorpayKeyId | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.razorpayKeySecret | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.secrets.razorpayWebhookSecret | quote }}
  ALERT_WEBHOOK_URL: {{ .Values.secrets.alertWebhookUrl | quote }}
