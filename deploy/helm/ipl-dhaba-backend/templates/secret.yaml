{{/*
This template used to render `kind: Secret` with `stringData` interpolated
straight from `.Values.secrets.*` — which meant the connection string, both JWT
signing keys and the Razorpay key pair had to live in a values file to deploy at
all. values.yaml carried a full set of them, tracked in git.

Now the chart renders an ExternalSecret and the operator fetches the material at
reconcile time, or it renders nothing and consumes a Secret you created out of
band. Either way `helm template` output contains no credentials, so it is safe to
diff in CI and paste into a ticket.

  secrets.externalSecret.enabled: true   → this chart declares the ExternalSecret
  secrets.existingSecret: <name>         → consume that Secret, render nothing
*/}}
{{- if .Values.secrets.existingSecret }}
{{- if .Values.secrets.externalSecret.enabled }}
{{- fail "secrets.existingSecret and secrets.externalSecret.enabled are mutually exclusive: pick who owns the Secret." }}
{{- end }}
{{- else if not .Values.secrets.externalSecret.enabled }}
{{- fail "No source of secrets configured. Set secrets.externalSecret.enabled=true, or point secrets.existingSecret at a Secret you created out of band." }}
{{- end }}
{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ipl-dhaba-backend.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "ipl-dhaba-backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.storeKind }}
    name: {{ .Values.secrets.externalSecret.storeName }}
  target:
    name: {{ include "ipl-dhaba-backend.secretName" . }}
    creationPolicy: Owner
    # `envFrom` is read once at container start, so a rotated value only reaches
    # a running pod on restart. Retained rather than deleted so an operator
    # outage does not take the credentials down with it.
    deletionPolicy: Retain
  data:
    {{- range $envVar, $ref := .Values.secrets.externalSecret.mapping }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ $ref.key | quote }}
        property: {{ $ref.property | quote }}
    {{- end }}
{{- end }}
