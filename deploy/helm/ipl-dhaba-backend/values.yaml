# ===================================================
# Helm Default Values for IPL Dhaba Backend
# ===================================================

replicaCount: 2

image:
  repository: ghcr.io/shxam/mobileapp/backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: "ipl-dhaba-backend"

serviceAccount:
  create: true
  annotations: {}
  name: "ipl-dhaba-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3001"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
  hosts:
    - host: api.ipldhaba.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-ipldhaba-tls
      hosts:
        - api.ipldhaba.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health/live
    port: 3001
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env:
  NODE_ENV: "production"
  PORT: "3001"
  REDIS_HOST: "ipldhaba-prod-redis.internal"
  REDIS_PORT: "6379"
  # Not secret — the browser origin allowlist that replaced `origin: '*'`, plus
  # the public app URL. Both are required in production; the configmap template
  # fails the render rather than letting a pod crash-loop on a missing value.
  CORS_ORIGINS: "https://ipldhaba.com,https://www.ipldhaba.com,https://admin.ipldhaba.com"
  APP_URL: "https://ipldhaba.com"

# ── Secrets ─────────────────────────────────────────
# This block used to hold the live values themselves — a Neon connection string
# with its password, both JWT signing keys, the gate-pass HMAC key and an
# `rzp_live_` Razorpay key pair — in a tracked file. It now describes only where
# to fetch them from; nothing here is confidential.
#
# Choose exactly one owner of the Secret:
#   externalSecret.enabled: true  → the chart declares an ExternalSecret and the
#                                   External Secrets Operator materialises it.
#   existingSecret: "my-secret"   → you created the Secret out of band; the chart
#                                   renders nothing and just consumes it.
# Setting both, or neither, fails at template time rather than deploying a pod
# with no credentials.
secrets:
  existingSecret: ""

  externalSecret:
    enabled: true
    storeKind: ClusterSecretStore
    storeName: ipl-dhaba-store
    refreshInterval: 1h
    # env var → where it lives in the backing store. Keys match what
    # `apps/backend/src/common/config/env.ts` requires; a missing one crash-loops
    # the pod on boot instead of falling back to a baked-in default. That file
    # also enforces a 32-character minimum on each signing key and rejects the
    # values that were previously committed to this repo.
    mapping:
      DATABASE_URL:
        key: ipldhaba/prod/database
        property: url
      REDIS_PASSWORD:
        key: ipldhaba/prod/redis
        property: password
      JWT_SECRET:
        key: ipldhaba/prod/jwt
        property: accessSecret
      JWT_REFRESH_SECRET:
        key: ipldhaba/prod/jwt
        property: refreshSecret
      GATE_PASS_SECRET:
        key: ipldhaba/prod/jwt
        property: gatePassSecret
      RAZORPAY_KEY_ID:
        key: ipldhaba/prod/razorpay
        property: keyId
      RAZORPAY_KEY_SECRET:
        key: ipldhaba/prod/razorpay
        property: keySecret
      RAZORPAY_WEBHOOK_SECRET:
        key: ipldhaba/prod/razorpay
        property: webhookSecret
      ALERT_WEBHOOK_URL:
        key: ipldhaba/prod/alerting
        property: slackWebhookUrl

migrationJob:
  enabled: true
