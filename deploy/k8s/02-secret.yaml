# ===================================================
# IPL Dhaba Backend — Secret material
#
# This file used to be a plain `kind: Secret` with `stringData` holding a Neon
# connection string, both JWT signing keys, the gate-pass HMAC key, an
# `rzp_live_`-prefixed Razorpay key pair and a Slack webhook URL — committed and
# pushed. Even as placeholders that is the wrong shape for a tracked file: the
# next person to deploy fills them in locally and the first `git add -A` leaks
# the real ones.
#
# Nothing secret is stored here now. The External Secrets Operator materialises
# the cluster Secret from the real store at reconcile time. The generated Secret
# keeps the name `ipl-dhaba-secret`, so 03-migration-job.yaml and
# 04-deployment.yaml consume it unchanged.
#
# Prerequisite — install the operator and a store once per cluster:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace
#   kubectl apply -f <your ClusterSecretStore>   # named `ipl-dhaba-store` below
#
# No operator available? Create the Secret imperatively instead of editing this
# file. Values come from your own shell, never from the repo:
#   kubectl create secret generic ipl-dhaba-secret -n ipldhaba \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
#     --from-literal=GATE_PASS_SECRET="$GATE_PASS_SECRET" \
#     --from-literal=RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
#     --from-literal=RAZORPAY_KEY_SECRET="$RAZORPAY_KEY_SECRET" \
#     --from-literal=RAZORPAY_WEBHOOK_SECRET="$RAZORPAY_WEBHOOK_SECRET" \
#     --from-literal=ALERT_WEBHOOK_URL="$ALERT_WEBHOOK_URL"
#
# Every key below is required. `apps/backend/src/common/config/env.ts` fails boot
# on a missing one rather than falling back to a baked-in default, so a
# partially-populated store surfaces as a crash-looping pod, not as a service
# quietly signing tokens with a well-known key. It also rejects any secret under
# 32 characters, and rejects the specific values that were once committed to this
# repo — reusing one of those is a boot failure, not a warning.
# ===================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ipl-dhaba-secret
  namespace: ipldhaba
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ipl-dhaba-store
  target:
    name: ipl-dhaba-secret
    creationPolicy: Owner
    # Without this a rotated value in the store never reaches a running pod,
    # because `envFrom` is read once at container start.
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: ipldhaba/prod/database
        property: url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ipldhaba/prod/redis
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: ipldhaba/prod/jwt
        property: accessSecret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: ipldhaba/prod/jwt
        property: refreshSecret
    - secretKey: GATE_PASS_SECRET
      remoteRef:
        key: ipldhaba/prod/jwt
        property: gatePassSecret
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: ipldhaba/prod/razorpay
        property: keyId
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: ipldhaba/prod/razorpay
        property: keySecret
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: ipldhaba/prod/razorpay
        property: webhookSecret
    - secretKey: ALERT_WEBHOOK_URL
      remoteRef:
        key: ipldhaba/prod/alerting
        property: slackWebhookUrl
