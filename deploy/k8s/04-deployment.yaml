apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipl-dhaba-backend
  namespace: ipldhaba
  labels:
    app: ipl-dhaba-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipl-dhaba-backend
  template:
    metadata:
      labels:
        app: ipl-dhaba-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/shxam/mobileapp/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: ipl-dhaba-config
            - secretRef:
                name: ipl-dhaba-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
